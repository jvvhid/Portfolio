<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/webhero.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jahid's Portfolio</title>
  <style>
    body {
      background-color: #030303;
      margin: 0;
    }
    .initial-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #030303;
      color: #006A4E;
      font-family: monospace;
      font-size: 1.5rem;
      flex-direction: column;
      gap: 20px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 106, 78, 0.3);
      border-radius: 50%;
      border-top-color: #006A4E;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="initial-loader">
      <div class="spinner"></div>
      <div>Loading...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
